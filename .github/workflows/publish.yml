# Publishes the package to npm on every version tag, with an npm
# provenance statement, as n8n requires of verified community nodes.
#
# Authentication: the NPM_TOKEN repository secret, a granular access
# token of the transpareo npm organisation with read and write rights
# on its packages and the two-factor requirement bypassed for
# automation. Provenance is signed through the workflow's OIDC token
# (id-token: write) whichever way npm is authenticated.
#
# Once the package exists on npm, trusted publishing can replace the
# token: in the package's settings, under Trusted Publishers, add
# GitHub Actions with the repository transpareo/n8n and the workflow
# publish.yml, then delete the NPM_TOKEN secret and the env line below.
#
# A release starts locally with `npm run release`, which lints, builds,
# asks for the version, updates the changelog, commits, tags and pushes;
# the tag starts this workflow, where the same command lints, builds and
# publishes.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check the tag names the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != package.json $version" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Release
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
