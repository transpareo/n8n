# Publishes the package to npm on every version tag, with an npm
# provenance statement, as n8n requires of verified community nodes.
#
# Authentication is npm trusted publishing. The package's settings on
# npmjs.com name GitHub Actions, the repository transpareo/n8n and this
# file, publish.yml, as its trusted publisher; `npm publish` exchanges
# the job's OIDC token (id-token: write) for a short-lived publish
# token, so the repository holds no npm secret. The same OIDC token
# signs the provenance statement, which `n8n-node release` requests
# with NPM_CONFIG_PROVENANCE.
#
# The exchange needs npm 11.5.1 or later, which every Node 24 release
# from 24.5.0 on bundles; node-version 24 takes the newest Node 24 on
# the runner. setup-node gets no registry-url, so it writes no .npmrc
# and sets no NODE_AUTH_TOKEN that npm could fall back to; npm uses its
# default registry, registry.npmjs.org.
#
# A release starts locally with `npm run release`, which lints, builds,
# asks for the version, updates the changelog, commits, tags and pushes;
# the tag starts this workflow, where the same command lints, builds and
# publishes.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check the tag names the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != package.json $version" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Release
        run: npm run release
